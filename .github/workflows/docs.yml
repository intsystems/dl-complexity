name: Documentation and prequential checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[docs,test]'
      - name: Check prequential implementations and demo
        run: |
          python -m pytest tests/test_coding.py tests/test_prequential_demo.py -q
          python -m pytest tests/test_analytical_codes_bounds.py -q -k 'online or blockwise or replay or temperature'
      - name: Build and execute documentation
        run: |
          python -m sphinx -b html -W --keep-going docs docs/_build/html
          python -m sphinx -b doctest -W docs docs/_build/doctest
      - uses: actions/upload-artifact@v4
        with:
          name: dl-complexity-documentation
          path: docs/_build/html
