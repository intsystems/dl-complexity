name: Documentation and prequential checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[docs,test,demo]'
      - name: Check prequential implementations and demo
        run: |
          python -m pytest tests/test_coding.py tests/test_prequential_demo.py -q
          python -m pytest tests/test_analytical_codes_bounds.py -q -k 'online or blockwise or replay or temperature'
      - name: Build and execute documentation
        run: |
          python -m sphinx -b html -W --keep-going docs docs/_build/html
          python -m sphinx -b doctest -W docs docs/_build/doctest
      - name: Execute demonstration notebook
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient

          notebook = nbformat.read("examples/demo.ipynb", as_version=4)
          nbformat.validate(notebook)
          NotebookClient(
              notebook, timeout=180, kernel_name="python3",
              resources={"metadata": {"path": "examples"}},
          ).execute()
          nbformat.write(notebook, Path("docs/_build/demo.executed.ipynb"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dl-complexity-documentation
          path: docs/_build/html
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
